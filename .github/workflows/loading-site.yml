name: Deploy Loading Site

on:
  push:
    branches:
      - master
    paths:
      - "LoadingSite/**"
      - ".github/workflows/loading-site.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy LoadingSite to Azure Storage
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload-batch \
              --account-name ecommercestoragejam \
              --auth-mode login \
              --destination '$web' \
              --source ./LoadingSite \
              --overwrite
