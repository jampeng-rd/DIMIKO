<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIMIKO | 網站啟動中</title>

    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/loading.css">
</head>
<body>

    <main class="loading-page">

        <section class="loading-card">

            <div class="brand">
                <h1>DIMIKO</h1>
                <p>OUTDOOR LIVING</p>
            </div>


            <div id="loader" class="loader" aria-hidden="true"></div>

            <div id="ready-icon" class="ready-icon" hidden>
                ✓
            </div>

            <div class="loading-content">
                <h2 id="status-title">商城正在準備中</h2>

                <p id="status-message">
                    我們正在為您準備露營用品商城，請稍候片刻。
                </p>
            </div>

            <div id="loading-status" class="loading-status">
                <span class="status-dot"></span>
                <span id="status-text">正在啟動服務 ...</span>
            </div>

            <a
                id="enter-store-button"
                class="enter-store-button"
                href="#"
                hidden>
                進入商城
            </a>


        </section>

    </main>

    <script src="js/loading.js"></script>

</body>
</html>
